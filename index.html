/* =========================================================
   CSV読み込み
========================================================= */

async function loadCSV(filename) {

  try {

    const response = await fetch(filename);

    if (!response.ok) {
      throw new Error(
        filename + " : HTTP " + response.status
      );
    }

    const text = await response.text();

    return parseCSV(text);

  } catch (error) {

    console.error(
      "CSV読み込みエラー:",
      filename,
      error
    );

    return [];
  }
}


/* =========================================================
   CSVパーサー
========================================================= */

function parseCSV(text) {

  text = text.replace(/^\uFEFF/, "");

  const lines = text
    .split(/\r?\n/)
    .filter(line => line.trim() !== "");

  return lines.map(line => {

    const result = [];

    let current = "";
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {

      const char = line[i];

      if (char === '"') {

        if (
          insideQuotes &&
          line[i + 1] === '"'
        ) {
          current += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }

      } else if (
        char === "," &&
        !insideQuotes
      ) {

        result.push(current);
        current = "";

      } else {

        current += char;
      }
    }

    result.push(current);

    return result.map(value =>
      value.trim()
    );

  });

}

/* =========================================================
   CSVの駅名を探す
========================================================= */

function findStationRow(
  rows,
  stationName
) {

  const target =
    stationName.replace(
      /駅$/,
      ""
    );

  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    const row = rows[i];

    for (
      let j = 0;
      j < row.length;
      j++
    ) {

      const cell =
        String(row[j])
          .replace(/駅$/, "")
          .trim();

      if (
        cell === target ||
        cell.includes(target)
      ) {

        return i;
      }
    }
  }

  return -1;
}


/* =========================================================
   時刻文字列
========================================================= */

function timeToMinutes(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return null;
  }

  const text =
    String(value).trim();

  const match =
    text.match(
      /^(\d{1,2})[:：](\d{2})$/
    );

  if (!match) {
    return null;
  }

  return (
    Number(match[1]) * 60 +
    Number(match[2])
  );
}


/* =========================================================
   分 → 時刻
========================================================= */

function minutesToTime(minutes) {

  minutes =
    ((minutes % 1440) + 1440) % 1440;

  const h =
    Math.floor(minutes / 60);

  const m =
    minutes % 60;

  return (
    String(h).padStart(2, "0") +
    ":" +
    String(m).padStart(2, "0")
  );
}


/* =========================================================
   現在時刻
========================================================= */

function getCurrentMinutes() {

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );
}


/* =========================================================
   平日・休日判定
========================================================= */

function isHoliday() {

  const day =
    new Date().getDay();

  return (
    day === 0 ||
    day === 6
  );
}


/* =========================================================
   進行方向
========================================================= */

function getDirection(
  line,
  fromIndex,
  toIndex
) {

  if (toIndex > fromIndex) {
    return "down";
  }

  return "up";
}

}


/* =========================================================
   時刻表から次の電車を探す
========================================================= */

function findNextTrain(
  line,
  fromStation,
  toStation,
  afterMinutes
) {

  const stationsList =
    line === "烏丸線"
      ? karasumaStations
      : tozaiStations;

  const fromIndex =
    stationsList.indexOf(
      fromStation
    );

  const toIndex =
    stationsList.indexOf(
      toStation
    );

  if (
    fromIndex === -1 ||
    toIndex === -1
  ) {
    return null;
  }

  const direction =
    getDirection(
      line,
      fromIndex,
      toIndex
    );

  const holiday =
    isHoliday();

  let key = "";

  if (line === "烏丸線") {

    if (holiday) {

      key =
        direction === "down"
          ? "karasumaHolidayDown"
          : "karasumaHolidayUp";

    } else {

      key =
        direction === "down"
          ? "karasumaWeekdayDown"
          : "karasumaWeekdayUp";
    }

  } else {

    if (holiday) {

      key =
        direction === "down"
          ? "tozaiHolidayDown"
          : "tozaiHolidayUp";

    } else {

      key =
        direction === "down"
          ? "tozaiWeekdayDown"
          : "tozaiWeekdayUp";
    }
  }

  const rows =
    trainData[key] || [];

  if (!rows.length) {
    return null;
  }


  /*
    駅名がある行を探す
  */

  const stationRow =
    findStationRow(
      rows,
      fromStation
    );

  if (stationRow === -1) {
    return null;
  }


  /*
    駅名が見つかった行の
    時刻を探す
  */

  const row =
    rows[stationRow];

  let candidates = [];


  for (
    let i = 0;
    i < row.length;
    i++
  ) {

    const minutes =
      timeToMinutes(row[i]);

    if (
      minutes !== null &&
      minutes >= afterMinutes
    ) {

      candidates.push(minutes);
    }
  }


  /*
    同じ行から見つからなかった場合、
    少し広めにCSV全体を探す
  */

  if (!candidates.length) {

    for (
      let r = 0;
      r < rows.length;
      r++
    ) {

      for (
        let c = 0;
        c < rows[r].length;
        c++
      ) {

        const minutes =
          timeToMinutes(
            rows[r][c]
          );

        if (
          minutes !== null &&
          minutes >= afterMinutes
        ) {

          candidates.push(minutes);
        }
      }
    }
  }


  if (!candidates.length) {
    return null;
  }


  const departure =
    Math.min(...candidates);


  /*
    駅間数から所要時間を概算
  */

  const stationCount =
    Math.abs(
      toIndex - fromIndex
    );

  const travelMinutes =
    Math.max(
      2,
      Math.round(
        stationCount * 2.2
      )
    );

  const arrival =
    departure + travelMinutes;


  return {

    line,
    from: fromStation,
    to: toStation,

    departure,
    arrival,

    departureText:
      minutesToTime(
        departure
      ),

    arrivalText:
      minutesToTime(
        arrival
      ),

    travelMinutes

  };
}


/* =========================================================
   同一路線の距離
========================================================= */

function getRailDistance(
  line,
  fromStation,
  toStation
) {

  const stationsList =
    line === "烏丸線"
      ? karasumaStations
      : tozaiStations;

  const distances =
    line === "烏丸線"
      ? karasumaDistances
      : tozaiDistances;

  const fromIndex =
    stationsList.indexOf(
      fromStation
    );

  const toIndex =
    stationsList.indexOf(
      toStation
    );

  if (
    fromIndex === -1 ||
    toIndex === -1
  ) {
    return 0;
  }

  const start =
    Math.min(
      fromIndex,
      toIndex
    );

  const end =
    Math.max(
      fromIndex,
      toIndex
    );

  let distance = 0;

  for (
    let i = start;
    i < end;
    i++
  ) {

    distance +=
      distances[i] || 0;
  }

  return distance;
}

    stationList
      .map(
        getStationCoordinates
      )
      .filter(Boolean);

  if (
    coordinates.length < 2
  ) {
    return;
  }

  const sourceId =
    "train-route";

  const layerId =
    "train-route-line";


  if (map.getLayer(layerId)) {
    map.removeLayer(layerId);
  }

  if (map.getSource(sourceId)) {
    map.removeSource(sourceId);
  }


  map.addSource(sourceId, {

    type: "geojson",

    data: {
      type: "Feature",

      geometry: {
        type: "LineString",
        coordinates
      }

    }

  });


  map.addLayer({

    id: layerId,

    type: "line",

    source: sourceId,

    paint: {

      "line-color": "#1976d2",

      "line-width": 5,

      "line-opacity": 0.9

    }

  });

}


/* =========================================================
   2路線乗り換えルート
========================================================= */

function findTrainRoute(
  startStation,
  goalStation,
  currentMinutes
) {

  const startLine =
    getStationLine(
      startStation
    );

  const goalLine =
    getStationLine(
      goalStation
    );


  /*
    同じ駅
  */

  if (
    startStation === goalStation
  ) {

    return {
      type: "same",
      distance: 0,
      duration: 0,
      stations: [startStation]
    };

  }


  /*
    同一路線
  */

  if (
    startLine === goalLine
  ) {

    const train =
      findNextTrain(
        startLine,
        startStation,
        goalStation,
        currentMinutes
      );

    const distance =
      getRailDistance(
        startLine,
        startStation,
        goalStation
      );

    if (!train) {
      return null;
    }

    const stationsList =
      startLine === "烏丸線"
        ? karasumaStations
        : tozaiStations;

    const a =
      stationsList.indexOf(
        startStation
      );

    const b =
      stationsList.indexOf(
        goalStation
      );

    const step =
      a < b ? 1 : -1;

    const routeStations = [];

    for (
      let i = a;
      ;
      i += step
    ) {

      routeStations.push(
        stationsList[i]
      );

      if (i === b) {
        break;
      }
    }

    return {

      type: "direct",

      train,

      distance,

      duration:
        train.travelMinutes,

      stations:
        routeStations

    };

  }


  /*
    烏丸御池で乗り換え
  */

  const transfer =
    "烏丸御池";


  const first =
    findNextTrain(
      startLine,
      startStation,
      transfer,
      currentMinutes
    );

  if (!first) {
    return null;
  }


  const second =
    findNextTrain(
      goalLine,
      transfer,
      goalStation,
      first.arrival + 4
    );

  if (!second) {
    return null;
  }


  const firstDistance =
    getRailDistance(
      startLine,
      startStation,
      transfer
    );

  const secondDistance =
    getRailDistance(
      goalLine,
      transfer,
      goalStation
    );


  const firstList =
    startLine === "烏丸線"
      ? karasumaStations
      : tozaiStations;

  const secondList =
    goalLine === "烏丸線"
      ? karasumaStations
      : tozaiStations;


  const firstA =
    firstList.indexOf(
      startStation
    );

  const firstB =
    firstList.indexOf(
      transfer
    );

  const firstStep =
    firstA < firstB
      ? 1
      : -1;


  const secondA =
    secondList.indexOf(
      transfer
    );

  const secondB =
    secondList.indexOf(
      goalStation
    );

  const secondStep =
    secondA < secondB
      ? 1
      : -1;


  const routeStations = [];


  for (
    let i = firstA;
    ;
    i += firstStep
  ) {

    routeStations.push(
      firstList[i]
    );

    if (i === firstB) {
      break;
    }
  }


  for (
    let i = secondA + secondStep;
    ;
    i += secondStep
  ) {

    routeStations.push(
      secondList[i]
    );

    if (i === secondB) {
      break;
    }
  }


  const duration =
    second.arrival -
    first.departure;


  return {

    type: "transfer",

    first,

    second,

    transfer,

    distance:
      firstDistance +
      secondDistance,

    duration,

    stations:
      routeStations

  };

}


/* =========================================================
   電車結果表示
========================================================= */

function displayTrainResult(
  result
) {

  const lineElement =
    document.getElementById(
      "train-line"
    );

  const timeElement =
    document.getElementById(
      "train-time"
    );

  const distanceElement =
    document.getElementById(
      "train-distance"
    );

  const co2Element =
    document.getElementById(
      "train-co2"
    );

  const statusElement =
    document.getElementById(
      "train-status"
    );


  if (!result) {

    lineElement.textContent =
      "🚃 地下鉄";

    timeElement.textContent =
      "--";

    distanceElement.textContent =
      "距離：検索できません";

    co2Element.textContent =
      "CO₂：--";

    statusElement.textContent =
      "近くの地下鉄駅や時刻表を確認してください。";

    return;
  }


  const distance =
    result.distance || 0;


  const co2 =
    Math.round(
      distance *
      TRAIN_CO2_PER_KM
    );


  if (
    result.type === "direct"
  ) {

    lineElement.textContent =
      "🚃 " +
      result.train.line;

    timeElement.textContent =
      result.train.departureText +
      " → " +
      result.train.arrivalText;

    statusElement.textContent =
      result.train.from +
      " → " +
      result.train.to;

  } else if (
    result.type === "transfer"
  ) {

    lineElement.textContent =
      "🚃 乗り換え";

    timeElement.textContent =
      result.first.departureText +
      " → " +
      result.second.arrivalText;

    statusElement.innerHTML =
      result.first.from +
      " → " +
      result.transfer +
      " → " +
      result.second.to +
      "<br>" +
      "烏丸御池で乗り換え";

  } else {

    lineElement.textContent =
      "🚃 地下鉄";

    timeElement.textContent =
      "同じ駅";

    statusElement.textContent =
      result.stations[0];

  }


  distanceElement.textContent =
    "距離：約 " +
    distance.toFixed(1) +
    " km";


  co2Element.textContent =
    "CO₂：約 " +
    co2 +
    " g";

}


/* =========================================================
   緯度経度間距離
========================================================= */

function haversineDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


/* =========================================================
   一番近い地下鉄駅
========================================================= */

function findNearestStation(
  latitude,
  longitude
) {

  let nearest = null;

  let minDistance =
    Infinity;


  for (
    const [name, station]
    of Object.entries(stations)
  ) {

    const distance =
      haversineDistance(
        latitude,
        longitude,
        station.lat,
        station.lon
      );


    if (
      distance <
      minDistance
    ) {

      minDistance =
        distance;

      nearest = {

        name,

        distance,

        ...station

      };

    }

  }


  return nearest;
}


/* =========================================================
   住所検索
   Nominatim
========================================================= */

async function geocode(
  place
) {

  const url =
    "https://nominatim.openstreetmap.org/search?" +
    new URLSearchParams({

      q: place,

      format: "json",

      limit: "1",

      countrycodes: "jp",

      "accept-language": "ja"

    });


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "住所検索に失敗しました"
    );

  }


  const data =
    await response.json();


  if (!data.length) {

    throw new Error(
      "場所が見つかりませんでした：" +
      place
    );

  }


  return {

    lat:
      Number(data[0].lat),

    lon:
      Number(data[0].lon),

    displayName:
      data[0].display_name

  };

}


/* =========================================================
   OSRMルート検索
========================================================= */

async function getRoute(
  start,
  goal,
  profile
) {

  const url =
    "https://router.project-osrm.org/route/v1/" +
    profile +
    "/" +
    start.lon +
    "," +
    start.lat +
    ";" +
    goal.lon +
    "," +
    goal.lat +
    "?" +
    new URLSearchParams({

      overview: "full",

      geometries: "geojson"

    });


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "ルート検索に失敗しました"
    );

  }


  const data =
    await response.json();


  if (
    !data.routes ||
    !data.routes.length
  ) {

    throw new Error(
      "ルートが見つかりませんでした"
    );

  }


  return data.routes[0];

}


/* =========================================================
   時間表示
========================================================= */

function formatDuration(
  minutes
) {

  minutes =
    Math.round(minutes);

  if (minutes < 60) {

    return minutes +
      "分";

  }


  const h =
    Math.floor(minutes / 60);

  const m =
    minutes % 60;


  if (m === 0) {

    return h +
      "時間";

  }


  return (
    h +
    "時間 " +
    m +
    "分"
  );

}


/* =========================================================
   ルート結果カード
========================================================= */

function displayRoadResult(
  type,
  route
) {

  const km =
    route.distance / 1000;


  let minutes;


  if (type === "walk") {

    minutes =
      km / 4.5 * 60;

  } else if (
    type === "bike"
  ) {

    minutes =
      km / 15 * 60;

  } else {

    minutes =
      route.duration / 60;

  }


  document.getElementById(
    type + "-time"
  ).textContent =
    formatDuration(
      minutes
    );


  document.getElementById(
    type + "-distance"
  ).textContent =
    "距離：" +
    km.toFixed(2) +
    " km";


  let co2 = 0;


  if (type === "car") {

    co2 =
      Math.round(
        km *
        CAR_CO2_PER_KM
      );

  }


  document.getElementById(
    type + "-co2"
  ).textContent =
    "CO₂：" +
    co2 +
    " g";

}


/* =========================================================
   駅まで徒歩ルート
========================================================= */

async function drawStationWalkingRoute(
  place,
  station
) {

  try {

    const stationPlace = {

      lat:
        station.lat,

      lon:
        station.lon

    };


    const route =
      await getRoute(
        place,
        stationPlace,
        "foot"
      );


    const coords =
      route.geometry.coordinates;


    /*
      駅までの徒歩ルートを
      薄い線として表示
    */

    const sourceId =
      "station-walk";

    const layerId =
      "station-walk-line";


    if (
      map.getLayer(layerId)
    ) {

      map.removeLayer(
        layerId
      );

    }


    if (
      map.getSource(sourceId)
    ) {

      map.removeSource(
        sourceId
      );

    }


    map.addSource(
      sourceId,
      {

        type: "geojson",

        data: {

          type: "Feature",

          geometry: {

            type: "LineString",

            coordinates: coords

          }

        }

      }
    );


    map.addLayer({

      id: layerId,

      type: "line",

      source: sourceId,

      paint: {

        "line-color":
          "#777",

        "line-width":
          3,

        "line-dasharray":
          [2, 2],

        "line-opacity":
          0.8

      }

    });


  } catch (error) {

    console.warn(
      "駅までの徒歩ルート表示エラー",
      error
    );

  }

}


/* =========================================================
   電車検索
========================================================= */

async function searchTrain(
  start,
  goal
) {

  const startStation =
    findNearestStation(
      start.lat,
      start.lon
    );


  const goalStation =
    findNearestStation(
      goal.lat,
      goal.lon
    );


  if (
    !startStation ||
    !goalStation
  ) {

    displayTrainResult(
      null
    );

    return;

  }


  const currentMinutes =
    getCurrentMinutes();


  const result =
    findTrainRoute(
      startStation.name,
      goalStation.name,
      currentMinutes
    );


  displayTrainResult(
    result
  );


  /*
    電車ルートを地図に表示
  */

  if (result) {

    drawTrainRoute(
      result.stations
    );

  }


  /*
    出発地 → 駅
  */

  await drawStationWalkingRoute(
    start,
    startStation
  );


  /*
    目的地側の駅情報を表示
  */

  const status =
    document.getElementById(
      "train-status"
    );


  if (result) {

    status.innerHTML +=
      "<br><br>" +
      "🚶 出発地最寄駅：" +
      startStation.name +
      "<br>" +
      "🚶 目的地最寄駅：" +
      goalStation.name;

  }

}


/* =========================================================
   メイン検索
========================================================= */

async function searchRoute() {

  const startText =
    document.getElementById(
      "start"
    ).value.trim();


  const goalText =
    document.getElementById(
      "goal"
    ).value.trim();


  if (
    !startText ||
    !goalText
  ) {

    alert(
      "出発地と目的地を入力してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "searchButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  button.disabled = true;

  button.textContent =
    "🔍 検索中...";


  status.textContent =
    "📍 場所を検索しています...";


  try {

    /*
      住所検索
    */

    const start =
      await geocode(
        startText
      );


    const goal =
      await geocode(
        goalText
      );


    /*
      マーカー
    */

    if (startMarker) {
      startMarker.remove();
    }

    if (goalMarker) {
      goalMarker.remove();
    }


    startMarker =
      new maplibregl.Marker({
        color: "#2e7d32"
      })
      .setLngLat([
        start.lon,
        start.lat
      ])
      .setPopup(
        new maplibregl.Popup()
          .setText(
            "出発地："
            + startText
          )
      )
      .addTo(map);


    goalMarker =
      new maplibregl.Marker({
        color: "#d32f2f"
      })
      .setLngLat([
        goal.lon,
        goal.lat
      ])
      .setPopup(
        new maplibregl.Popup()
          .setText(
            "目的地："
            + goalText
          )
      )
      .addTo(map);


    /*
      地図を出発地・目的地に合わせる
    */

    const bounds =
      new maplibregl.LngLatBounds();

    bounds.extend([
      start.lon,
      start.lat
    ]);

    bounds.extend([
      goal.lon,
      goal.lat
    ]);

    map.fitBounds(
      bounds,
      {
        padding: 70,
        maxZoom: 15
      }
    );


    status.textContent =
      "🛣️ 道路ルートを検索しています...";


    /*
      徒歩
    */

    const walkRoute =
      await getRoute(
        start,
        goal,
        "foot"
      );

    displayRoadResult(
      "walk",
      walkRoute
    );


    /*
      自転車
    */

    const bikeRoute =
      await getRoute(
        start,
        goal,
        "bike"
      );

    displayRoadResult(
      "bike",
      bikeRoute
    );


    /*
      車
    */

    const carRoute =
      await getRoute(
        start,
        goal,
        "car"
      );

    displayRoadResult(
      "car",
      carRoute
    );


    /*
      道路ルートを表示
    */

    drawRoute(
      walkRoute.geometry.coordinates
    );


    /*
      電車
    */

    status.textContent =
      "🚃 地下鉄ルートを検索しています...";


    await searchTrain(
      start,
      goal
    );


    status.innerHTML =
      "✅ ルート検索が完了しました。<br>" +
      "出発地：" +
      startText +
      "<br>" +
      "目的地：" +
      goalText;


  } catch (error) {

    console.error(error);


    status.innerHTML =
      "❌ エラーが発生しました。<br>" +
      error.message +
      "<br><br>" +
      "住所をもう少し具体的に入力してみてください。";


  } finally {

    button.disabled = false;

    button.textContent =
      "🚀 ルート検索";

  }

}
