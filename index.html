<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🌱 Eco Route</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5fff5;
      color: #333;
    }

    header {
      background: #4caf50;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 28px;
      font-weight: bold;
    }

    .search-box {
      padding: 15px;
      background: white;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    input {
      padding: 12px;
      font-size: 16px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #388e3c;
    }

    #map {
      height: 450px;
      width: 100%;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .card.best {
      border: 3px solid #4caf50;
    }

    .icon {
      font-size: 40px;
    }

    h3 {
      margin: 10px 0;
      font-size: 22px;
    }

    .info {
      margin: 10px 0;
      color: #555;
    }

    .big-number {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    .co2 {
      margin-top: 15px;
      color: #388e3c;
      font-weight: bold;
    }

    .co2-number {
      font-size: 20px;
      margin-top: 4px;
    }

    .train-status {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .note {
      margin: 10px 20px 30px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }

  </style>

</head>


<body>

  <header>
    🌱 Eco Route
  </header>


  <!-- 検索欄 -->

  <div class="search-box">

    <input
      id="start"
      type="text"
      placeholder="出発地"
    >

    <input
      id="end"
      type="text"
      placeholder="目的地"
    >

    <button onclick="searchRoute()">
      ルート検索
    </button>

  </div>


  <!-- 地図 -->

  <div id="map"></div>


  <!-- ルート比較 -->

  <div class="cards">


    <!-- 徒歩 -->

    <div class="card best">

      <div class="icon">🚶</div>

      <h3>徒歩</h3>

      <div class="info">
        距離

        <div
          class="big-number"
          id="walk-distance"
        >
          --
        </div>

      </div>

      <div class="info">
        時間

        <div
          class="big-number"
          id="walk-time"
        >
          --
        </div>

      </div>

      <div class="co2">

        🌱 CO₂

        <div class="co2-number">
          0 g
        </div>

      </div>

    </div>


    <!-- 自転車 -->

    <div class="card">

      <div class="icon">🚲</div>

      <h3>自転車</h3>

      <div class="info">
        距離

        <div
          class="big-number"
          id="bike-distance"
        >
          --
        </div>

      </div>

      <div class="info">
        時間

        <div
          class="big-number"
          id="bike-time"
        >
          --
        </div>

      </div>

      <div class="co2">

        🌱 CO₂

        <div class="co2-number">
          0 g
        </div>

      </div>

    </div>


    <!-- 車 -->

    <div class="card">

      <div class="icon">🚗</div>

      <h3>車</h3>

      <div class="info">
        距離

        <div
          class="big-number"
          id="car-distance"
        >
          --
        </div>

      </div>

      <div class="info">
        時間

        <div
          class="big-number"
          id="car-time"
        >
          --
        </div>

      </div>

      <div class="co2">

        🌱 CO₂

        <div
          class="co2-number"
          id="car-co2"
        >
          --
        </div>

      </div>

    </div>


    <!-- 電車 -->

    <div class="card">

      <div class="icon">🚃</div>

      <h3>電車</h3>

      <div class="info">
        距離

        <div
          class="big-number"
          id="train-distance"
        >
          --
        </div>

      </div>

      <div class="info">
        時間

        <div
          class="big-number"
          id="train-time"
        >
          --
        </div>

      </div>

      <div class="co2">

        🌱 CO₂

        <div
          class="co2-number"
          id="train-co2"
        >
          --
        </div>

      </div>

      <div
        class="train-status"
        id="train-status"
      >
        電車データを読み込み中...
      </div>

    </div>


    <!-- バス -->

    <div class="card">

      <div class="icon">🚌</div>

      <h3>バス</h3>

      <div class="info">
        距離

        <div class="big-number">
          --
        </div>

      </div>

      <div class="info">
        時間

        <div class="big-number">
          --
        </div>

      </div>

      <div class="co2">

        🌱 CO₂

        <div class="co2-number">
          --
        </div>

      </div>

    </div>

  </div>


  <!-- 注記 -->

  <div class="note">

    <strong>注記</strong><br>

    徒歩は時速4.5km、
    自転車は時速15km、
    車は時速50km
    と仮定して所要時間を計算しています。<br>

    車のCO₂排出量は
    1kmあたり130g
    として計算しています。<br>

    実際の所要時間やCO₂排出量は、
    道路状況・交通状況などによって異なります。

  </div>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    // ========================================
    // 🗺️ 地図
    // ========================================

    const map =
      L.map('map').setView(
        [35.0116, 135.7681],
        13
      );


    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:
          '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    let routeLines = [];


    // ========================================
    // 🚃 電車CSVファイル
    // ========================================

    const trainFiles = {

      karasumaWeekdayUp:
        "karasuma-weekday-up.csv",

      karasumaWeekdayDown:
        "karasuma-weekday-down.csv",

      karasumaHolidayUp:
        "karasuma-holiday-up.csv",

      karasumaHolidayDown:
        "karasuma-holiday-down.csv",

      tozaiWeekdayUp:
        "tozai-weekday-up.csv",

      tozaiWeekdayDown:
        "tozai-weekday-down.csv",

      tozaiHolidayUp:
        "tozai-holiday-up.csv",

      tozaiHolidayDown:
        "tozai-holiday-down.csv"

    };


    // ========================================
    // 🚃 電車データ
    // ========================================

    let trainData = {};


    // ========================================
    // CSV読み込み
    // ========================================

    async function loadCSV(filename) {

      const response =
        await fetch(filename);

      if (!response.ok) {

        throw new Error(
          filename +
          " を読み込めませんでした"
        );

      }

      const text =
        await response.text();

      return parseCSV(text);

    }


    // ========================================
    // CSV解析
    // ========================================

    function parseCSV(text) {

      // BOM削除

      text =
        text.replace(/^\uFEFF/, "");


      const rows = [];

      let row = [];

      let cell = "";

      let insideQuotes = false;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        const char = text[i];

        const next = text[i + 1];


        // ダブルクォーテーション

        if (char === '"') {

          if (
            insideQuotes &&
            next === '"'
          ) {

            cell += '"';

            i++;

          } else {

            insideQuotes =
              !insideQuotes;

          }

          continue;

        }


        // カンマ

        if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(cell);

          cell = "";

          continue;

        }


        // 改行

        if (
          (
            char === "\n" ||
            char === "\r"
          ) &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            next === "\n"
          ) {

            i++;

          }

          row.push(cell);

          rows.push(row);

          row = [];

          cell = "";

          continue;

        }


        cell += char;

      }


      // 最後のセル

      if (
        cell !== "" ||
        row.length > 0
      ) {

        row.push(cell);

        rows.push(row);

      }


      return rows;

    }


    // ========================================
    // 🚃 8個のCSVを読み込む
    // ========================================

    async function loadAllTrainData() {

      const status =
        document.getElementById(
          "train-status"
        );


      status.textContent =
        "🚃 電車データを読み込んでいます...";


      try {

        const fileNames =
          Object.entries(trainFiles);


        for (
          const [name, filename]
          of fileNames
        ) {

          console.log(
            "読み込み中:",
            filename
          );


          trainData[name] =
            await loadCSV(filename);


          console.log(
            "読み込み完了:",
            filename,
            trainData[name]
          );

        }


        // 全部成功

        status.textContent =
          "✓ 電車データ8件を読み込みました";


        status.style.color =
          "#388e3c";


        console.log(
          "🚃 全電車データ:",
          trainData
        );


      } catch (error) {

        console.error(
          "電車データ読み込みエラー:",
          error
        );


        status.textContent =
          "⚠ 電車データの読み込みに失敗しました";


        status.style.color =
          "#d32f2f";

      }

    }


    // ========================================
    // ページを開いたらCSV読み込み
    // ========================================

    loadAllTrainData();


    // ========================================
    // 📍 住所 → 緯度経度
    // ========================================

    async function geocode(place) {

      const url =
        `https://nominatim.openstreetmap.org/search` +
        `?format=json&q=` +
        `${encodeURIComponent(place)}`;


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (
        data.length === 0
      ) {

        throw new Error(
          place +
          " が見つかりませんでした"
        );

      }


      return {

        lat:
          parseFloat(data[0].lat),

        lon:
          parseFloat(data[0].lon)

      };

    }


    // ========================================
    // 📏 距離表示
    // ========================================

    function formatDistance(meters) {

      if (
        meters < 1000
      ) {

        return (
          Math.round(meters) +
          " m"
        );

      }


      return (
        (meters / 1000)
          .toFixed(1) +
        " km"
      );

    }


    // ========================================
    // ⏱️ 時間表示
    // ========================================

    function formatTime(minutes) {

      minutes =
        Math.round(minutes);


      if (
        minutes < 60
      ) {

        return (
          minutes +
          "分"
        );

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      const mins =
        minutes % 60;


      return (
        hours +
        "時間" +
        mins +
        "分"
      );

    }


    // ========================================
    // 🛣️ OSRMルート取得
    // ========================================

    async function getRoute(
      start,
      end,
      profile
    ) {

      const url =
        `https://router.project-osrm.org/route/v1/${profile}/` +
        `${start.lon},${start.lat};` +
        `${end.lon},${end.lat}` +
        `?overview=full&geometries=geojson`;


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (
        data.code !== "Ok"
      ) {

        throw new Error(
          "ルートを取得できませんでした"
        );

      }


      return data.routes[0];

    }


    // ========================================
    // 🔎 ルート検索
    // ========================================

    async function searchRoute() {

      const startText =
        document.getElementById(
          "start"
        ).value;


      const endText =
        document.getElementById(
          "end"
        ).value;


      if (
        !startText ||
        !endText
      ) {

        alert(
          "出発地と目的地を入力してください！"
        );

        return;

      }


      try {

        // ------------------------------
        // 地名検索
        // ------------------------------

        const start =
          await geocode(startText);


        const end =
          await geocode(endText);


        // ------------------------------
        // 地図移動
        // ------------------------------

        map.setView(
          [
            start.lat,
            start.lon
          ],
          13
        );


        // ------------------------------
        // 前のルート削除
        // ------------------------------

        routeLines.forEach(
          line => {

            map.removeLayer(line);

          }
        );


        routeLines = [];


        // ------------------------------
        // 出発地点
        // ------------------------------

        L.marker(
          [
            start.lat,
            start.lon
          ]
        )
        .addTo(map)
        .bindPopup("出発地")
        .openPopup();


        // ------------------------------
        // 目的地点
        // ------------------------------

        L.marker(
          [
            end.lat,
            end.lon
          ]
        )
        .addTo(map)
        .bindPopup("目的地");


        // =================================
        // 🚶 徒歩
        // =================================

        const walk =
          await getRoute(
            start,
            end,
            "walking"
          );


        // =================================
        // 🚲 自転車
        // =================================

        const bike =
          await getRoute(
            start,
            end,
            "cycling"
          );


        // =================================
        // 🚗 車
        // =================================

        const car =
          await getRoute(
            start,
            end,
            "driving"
          );


        // =================================
        // 🚶 徒歩ルートを地図に表示
        // =================================

        const walkLine =
          L.geoJSON(
            walk.geometry
          ).addTo(map);


        routeLines.push(
          walkLine
        );


        // =================================
        // 📏 距離
        // =================================

        document.getElementById(
          "walk-distance"
        ).textContent =
          formatDistance(
            walk.distance
          );


        document.getElementById(
          "bike-distance"
        ).textContent =
          formatDistance(
            bike.distance
          );


        document.getElementById(
          "car-distance"
        ).textContent =
          formatDistance(
            car.distance
          );


        // =================================
        // 🚶 徒歩時間
        // =================================

        const walkTime =
          (walk.distance / 1000)
          / 4.5 * 60;


        document.getElementById(
          "walk-time"
        ).textContent =
          formatTime(
            walkTime
          );


        // =================================
        // 🚲 自転車時間
        // =================================

        const bikeTime =
          (bike.distance / 1000)
          / 15 * 60;


        document.getElementById(
          "bike-time"
        ).textContent =
          formatTime(
            bikeTime
          );


        // =================================
        // 🚗 車時間
        // =================================

        const carTime =
          (car.distance / 1000)
          / 50 * 60;


        document.getElementById(
          "car-time"
        ).textContent =
          formatTime(
            carTime
          );


        // =================================
        // 🚗 車CO₂
        // =================================

        const carCO2 =
          (car.distance / 1000)
          * 130;


        document.getElementById(
          "car-co2"
        ).textContent =
          Math.round(carCO2) +
          " g";


      } catch (error) {

        console.error(error);


        alert(
          "ルート検索でエラーが発生しました。\n" +
          error.message
        );

      }

    }


  </script>

</body>

</html>
