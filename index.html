// ========================================
// CSV読み込み
// ========================================


async function loadCSV(filename) {


  const response =

    await fetch(filename);


  if (!response.ok) {

    throw new Error(

      filename +
      " を読み込めませんでした"

    );

  }


  const text =

    await response.text();


  return parseCSV(text);

}



// ========================================
// CSV解析
// ========================================


function parseCSV(text) {


  text =

    text.replace(/^\uFEFF/, "");


  const rows = [];


  let row = [];

  let cell = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {


    const char = text[i];

    const next = text[i + 1];


    if (char === '"') {


      if (

        insideQuotes &&
        next === '"'

      ) {

        cell += '"';

        i++;

      } else {

        insideQuotes =
          !insideQuotes;

      }


      continue;

    }


    if (

      char === "," &&
      !insideQuotes

    ) {

      row.push(cell);

      cell = "";

      continue;

    }


    if (

      (char === "\n" ||
       char === "\r") &&
      !insideQuotes

    ) {


      if (

        char === "\r" &&
        next === "\n"

      ) {

        i++;

      }


      row.push(cell);

      rows.push(row);

      row = [];

      cell = "";

      continue;

    }


    cell += char;

  }


  if (

    cell !== "" ||
    row.length > 0

  ) {

    row.push(cell);

    rows.push(row);

  }


  return rows;

}

// ========================================
// 📍 住所 → 緯度経度
// ========================================


async function geocode(place) {


  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&q=" +

    encodeURIComponent(place);


  const response =

    await fetch(url);


  const data =

    await response.json();


  if (data.length === 0) {

    throw new Error(

      place +
      " が見つかりませんでした"

    );

  }


  return {

    lat:
      parseFloat(data[0].lat),

    lon:
      parseFloat(data[0].lon)

  };

}



// ========================================
// 📏 距離表示
// ========================================


function formatDistance(meters) {


  if (meters < 1000) {

    return (

      Math.round(meters) +
      " m"

    );

  }


  return (

    (meters / 1000).toFixed(1) +
    " km"

  );

}



// ========================================
// ⏱️ 時間表示
// ========================================


function formatTime(minutes) {


  minutes =
    Math.round(minutes);


  if (minutes < 60) {

    return (

      minutes +
      "分"

    );

  }


  const hours =

    Math.floor(
      minutes / 60
    );


  const mins =

    minutes % 60;


  return (

    hours +
    "時間" +
    mins +
    "分"

  );

}



// ========================================
// 🚗 OSRM
// ========================================


async function getRoute(

  start,
  end,
  profile

) {


  const url =

    "https://router.project-osrm.org/route/v1/" +

    profile +

    "/" +

    `${start.lon},${start.lat};` +

    `${end.lon},${end.lat}` +

    "?overview=full&geometries=geojson";


  const response =

    await fetch(url);


  const data =

    await response.json();


  if (data.code !== "Ok") {

    throw new Error(

      "ルートを取得できませんでした"

    );

  }


  return data.routes[0];

}



// ========================================
// 🚇 路線判定
// ========================================


function getStationLine(station) {


  const inKarasuma =

    karasumaStations.includes(
      station
    );


  const inTozai =

    tozaiStations.includes(
      station
    );


  if (
    inKarasuma &&
    inTozai
  ) {

    return "both";

  }


  if (inKarasuma) {

    return "karasuma";

  }


  if (inTozai) {

    return "tozai";

  }


  return null;

}



// ========================================
// 🚇 時刻を分に変換
// ========================================


function timeToMinutes(time) {


  if (!time) {

    return null;

  }


  const parts =

    time
      .trim()
      .split(":");


  if (parts.length !== 2) {

    return null;

  }


  let hour =
    parseInt(parts[0], 10);


  const minute =
    parseInt(parts[1], 10);


  if (

    isNaN(hour) ||
    isNaN(minute)

  ) {

    return null;

  }


  if (hour < 3) {

    hour += 24;

  }


  return (

    hour * 60 +
    minute

  );

}



// ========================================
// 時刻表示
// ========================================


function minutesToTime(minutes) {


  minutes =

    minutes % (24 * 60);


  const hour =

    Math.floor(
      minutes / 60
    );


  const minute =

    minutes % 60;


  return (

    String(hour).padStart(2, "0") +
    ":" +
    String(minute).padStart(2, "0")

  );

}



// ========================================
// 現在時刻
// ========================================


function getCurrentMinutes() {


  const now =
    new Date();


  return (

    now.getHours() * 60 +
    now.getMinutes()

  );

}



// ========================================
// CSVの駅名ヘッダーを探す
// ========================================


function findHeaderRow(rows) {


  for (

    let i = 0;

    i < Math.min(rows.length, 10);

    i++

  ) {


    const row = rows[i];


    if (!row) continue;


    const count =

      row.filter(cell =>

        karasumaStations.includes(cell) ||

        tozaiStations.includes(cell)

      ).length;


    if (count >= 3) {

      return i;

    }

  }


  return -1;

}



// ========================================
// 次の直通電車
// ========================================


function findNextDirectTrain(

  rows,
  fromStation,
  toStation,
  afterMinutes

) {


  const headerIndex =
    findHeaderRow(rows);


  if (headerIndex < 0) {

    return null;

  }


  const header =
    rows[headerIndex];


  const fromIndex =
    header.indexOf(fromStation);


  const toIndex =
    header.indexOf(toStation);


  if (

    fromIndex < 0 ||
    toIndex < 0

  ) {

    return null;

  }


  const fromOrder =
    fromIndex;


  const toOrder =
    toIndex;


  // 同じ方向でない場合は不可

  if (
    fromOrder === toOrder
  ) {

    return null;

  }


  let best = null;


  for (

    let r =
      headerIndex + 1;

    r < rows.length;

    r++

  ) {


    const row =
      rows[r];


    if (!row) continue;


    const depart =
      timeToMinutes(
        row[fromIndex]
      );


    const arrive =
      timeToMinutes(
        row[toIndex]
      );


    if (

      depart === null ||
      arrive === null

    ) {

      continue;

    }


    if (

      depart >= afterMinutes &&
      arrive >= depart

    ) {


      if (

        !best ||
        depart < best.depart

      ) {


        best = {

          depart,

          arrive,

          row

        };

      }

    }

  }


  return best;

}



// ========================================
// 🚇 路線の候補を探す
// ========================================


function searchLineTrain(

  line,
  fromStation,
  toStation,
  afterMinutes

) {


  const isWeekday =

    ![0, 6].includes(
      new Date().getDay()
    );


  let files;


  if (line === "karasuma") {


    files = isWeekday

      ? [

          trainData.karasumaWeekdayUp,

          trainData.karasumaWeekdayDown

        ]

      : [

          trainData.karasumaHolidayUp,

          trainData.karasumaHolidayDown

        ];

  }


  if (line === "tozai") {


    files = isWeekday

      ? [

          trainData.tozaiWeekdayUp,

          trainData.tozaiWeekdayDown

        ]

      : [

          trainData.tozaiHolidayUp,

          trainData.tozaiHolidayDown

        ];

  }


  if (!files) {

    return null;

  }


  let best = null;


  for (

    const rows of files

  ) {


    if (!rows) continue;


    const result =

      findNextDirectTrain(

        rows,

        fromStation,

        toStation,

        afterMinutes

      );


    if (

      result &&

      (!best ||
       result.depart < best.depart)

    ) {

      best = {

        ...result,

        line

      };

    }

  }


  return best;

}



// ========================================
// 🚇 同一路線・乗換検索
// ========================================


function findTrainRoute(

  fromStation,
  toStation,
  afterMinutes

) {


  if (
    fromStation ===
    toStation
  ) {

    return {

      type: "same",

      totalMinutes: 0,

      distanceKm: 0

    };

  }


  const fromLine =
    getStationLine(fromStation);


  const toLine =
    getStationLine(toStation);


  // --------------------------
  // 烏丸御池が出発駅
  // --------------------------

  if (
    fromStation ===
    "烏丸御池"
  ) {


    const line =

      toLine === "tozai"

        ? "tozai"

        : "karasuma";


    const train =

      searchLineTrain(

        line,

        fromStation,

        toStation,

        afterMinutes

      );


    if (!train) return null;


    return {

      type: "direct",

      train,

      totalMinutes:
        train.arrive -
        afterMinutes,

      distanceKm:
        getRailDistance(
          fromStation,
          toStation,
          line
        )

    };

  }



  // --------------------------
  // 烏丸御池が到着駅
  // --------------------------

  if (
    toStation ===
    "烏丸御池"
  ) {


    const line =

      fromLine === "tozai"

        ? "tozai"

        : "karasuma";


    const train =

      searchLineTrain(

        line,

        fromStation,

        toStation,

        afterMinutes

      );


    if (!train) return null;


    return {

      type: "direct",

      train,

      totalMinutes:
        train.arrive -
        afterMinutes,

      distanceKm:
        getRailDistance(
          fromStation,
          toStation,
          line
        )

    };

  }



  // --------------------------
  // 同一路線
  // --------------------------

  if (
    fromLine === toLine &&
    fromLine !== "both"
  ) {


    const train =

      searchLineTrain(

        fromLine,

        fromStation,

        toStation,

        afterMinutes

      );


    if (!train) return null;


    return {

      type: "direct",

      train,

      totalMinutes:
        train.arrive -
        afterMinutes,

      distanceKm:
        getRailDistance(
          fromStation,
          toStation,
          fromLine
        )

    };

  }



  // --------------------------
  // 烏丸御池乗換
  // --------------------------

  const firstLine =

    fromLine === "tozai"

      ? "tozai"

      : "karasuma";


  const secondLine =

    toLine === "tozai"

      ? "tozai"

      : "karasuma";


  const first =

    searchLineTrain(

      firstLine,

      fromStation,

      "烏丸御池",

      afterMinutes

    );


  if (!first) return null;


  // 乗換4分

  const secondStart =

    first.arrive + 4;


  const second =

    searchLineTrain(

      secondLine,

      "烏丸御池",

      toStation,

      secondStart

    );


  if (!second) return null;


  const wait =

    second.depart -
    first.arrive;


  return {

    type: "transfer",

    first,

    second,

    transferMinutes: wait,

    totalMinutes:
      second.arrive -
      afterMinutes,

    distanceKm:

      getRailDistance(
        fromStation,
        "烏丸御池",
        firstLine
      )

      +

      getRailDistance(
        "烏丸御池",
        toStation,
        secondLine
      )

  };

}



// ========================================
// 🚇 駅間距離を計算
// ========================================


function getRailDistance(

  fromStation,
  toStation,
  line

) {


  let stations;

  let distances;


  if (
    line === "karasuma"
  ) {

    stations =
      karasumaStations;

    distances =
      karasumaDistances;

  } else {

    stations =
      tozaiStations;

    distances =
      tozaiDistances;

  }


  const from =
    stations.indexOf(
      fromStation
    );


  const to =
    stations.indexOf(
      toStation
    );


  if (
    from < 0 ||
    to < 0
  ) {

    return 0;

  }


  let distance = 0;


  const start =
    Math.min(from, to);


  const end =
    Math.max(from, to);


  for (

    let i = start;

    i < end;

    i++

  ) {

    distance +=
      distances[i] || 0;

  }


  return distance;

}



// ========================================
// 🚃 電車検索結果を表示
// ========================================


function displayTrainResult(

  result,
  fromStation,
  toStation

) {


  const lineElement =

    document.getElementById(
      "train-line"
    );


  const timeElement =

    document.getElementById(
      "train-time"
    );


  const distanceElement =

    document.getElementById(
      "train-distance"
    );


  const co2Element =

    document.getElementById(
      "train-co2"
    );


  const statusElement =

    document.getElementById(
      "train-status"
    );


  if (!result) {


    lineElement.textContent =
      "--";


    timeElement.textContent =
      "--";


    distanceElement.textContent =
      "--";


    co2Element.textContent =
      "--";


    statusElement.textContent =

      "この条件で電車を見つけられませんでした";


    statusElement.style.color =
      "#d32f2f";


    return;

  }



  const distanceKm =

    result.distanceKm;


  const co2 =

    distanceKm *
    TRAIN_CO2_PER_KM;


  // --------------------------
  // 区間
  // --------------------------

  if (
    result.type ===
    "transfer"
  ) {


    lineElement.textContent =

      "乗換1回";


    statusElement.textContent =

      `${fromStation} → 烏丸御池 → ${toStation}`;

  }

  else {


    lineElement.textContent =

      fromStation +
      " → " +
      toStation;


    statusElement.textContent =

      result.train

        ? (
            result.train.line ===
            "karasuma"
              ? "烏丸線"
              : "東西線"
          )

        : "同一駅";

  }



  // --------------------------
  // 時間
  // --------------------------

  timeElement.textContent =

    formatTime(
      result.totalMinutes
    );



  // --------------------------
  // 距離
  // --------------------------

  distanceElement.textContent =

    distanceKm.toFixed(1) +
    " km";



  // --------------------------
  // CO₂
  // --------------------------

  co2Element.textContent =

    Math.round(co2) +
    " g";



  statusElement.style.color =
    "#388e3c";

}



// ========================================
// 🚃 電車を検索
// ========================================


function searchTrain(

  fromStation,
  toStation

) {


  if (
    Object.keys(
      trainData
    ).length < 8
  ) {

    console.log(
      "電車CSV読み込み待ち"
    );

    return;

  }


  const result =

    findTrainRoute(

      fromStation,

      toStation,

      getCurrentMinutes()

    );


  displayTrainResult(

    result,

    fromStation,

    toStation

  );

}



// ========================================
// 🌱 メイン検索
// ========================================


async function searchRoute() {


  const startText =

    document.getElementById(
      "start"
    ).value;


  const endText =

    document.getElementById(
      "end"
    ).value;


  if (
    !startText ||
    !endText
  ) {


    alert(

      "出発地と目的地を入力してください！"

    );


    return;

  }


  try {


    // --------------------------
    // 住所検索
    // --------------------------

    const start =

      await geocode(
        startText
      );


    const end =

      await geocode(
        endText
      );



    // --------------------------
    // 地図
    // --------------------------

    map.setView(

      [
        start.lat,
        start.lon
      ],

      13

    );



    // 前の線を消す

    routeLines.forEach(

      line => {

        map.removeLayer(
          line
        );

      }

    );


    routeLines = [];



    // --------------------------
    // 出発地マーカー
    // --------------------------

    L.marker(

      [
        start.lat,
        start.lon
      ]

    )

    .addTo(map)

    .bindPopup(
      "出発地"
    )

    .openPopup();



    // --------------------------
    // 目的地マーカー
    // --------------------------

    L.marker(

      [
        end.lat,
        end.lon
      ]

    )

    .addTo(map)

    .bindPopup(
      "目的地"
    );



    // --------------------------
    // 徒歩
    // --------------------------

    const walk =

      await getRoute(

        start,
        end,
        "walking"

      );



    // --------------------------
    // 自転車
    // --------------------------

    const bike =

      await getRoute(

        start,
        end,
        "cycling"

      );



    // --------------------------
    // 車
    // --------------------------

    const car =

      await getRoute(

        start,
        end,
        "driving"

      );



    // --------------------------
    // 徒歩ルート表示
    // --------------------------

    const walkLine =

      L.geoJSON(

        walk.geometry

      ).addTo(map);


    routeLines.push(
      walkLine
    );



    // --------------------------
    // 距離
    // --------------------------

    document.getElementById(
      "walk-distance"
    ).textContent =

      formatDistance(
        walk.distance
      );


    document.getElementById(
      "bike-distance"
    ).textContent =

      formatDistance(
        bike.distance
      );


    document.getElementById(
      "car-distance"
    ).textContent =

      formatDistance(
        car.distance
      );



    // --------------------------
    // 時間
    // --------------------------

    const walkTime =

      (
        walk.distance /
        1000
      )
      / 4.5
      * 60;


    document.getElementById(
      "walk-time"
    ).textContent =

      formatTime(
        walkTime
      );



    const bikeTime =

      (
        bike.distance /
        1000
      )
      / 15
      * 60;


    document.getElementById(
      "bike-time"
    ).textContent =

      formatTime(
        bikeTime
      );



    const carTime =

      (
        car.distance /
        1000
      )
      / 50
      * 60;


    document.getElementById(
      "car-time"
    ).textContent =

      formatTime(
        carTime
      );



    // --------------------------
    // 車CO₂
    // --------------------------

    const carCO2 =

      (
        car.distance /
        1000
      )
      * 130;


    document.getElementById(
      "car-co2"
    ).textContent =

      Math.round(
        carCO2
      ) +
      " g";



    // --------------------------
    // 🚃 電車
    //
    // 今回は駅名入力ではなく、
    // まず動作確認用として
    // 出発地・目的地が駅名の場合
    // 電車検索を行う
    // --------------------------

    const possibleStartStation =

      findStationName(
        startText
      );


    const possibleEndStation =

      findStationName(
        endText
      );


    if (

      possibleStartStation &&
      possibleEndStation

    ) {


      searchTrain(

        possibleStartStation,

        possibleEndStation

      );

    }

    else {


      document.getElementById(
        "train-line"
      ).textContent =
        "--";


      document.getElementById(
        "train-time"
      ).textContent =
        "--";


      document.getElementById(
        "train-distance"
      ).textContent =
        "--";


      document.getElementById(
        "train-co2"
      ).textContent =
        "--";


      document.getElementById(
        "train-status"
      ).textContent =

        "駅名を入力すると電車を検索できます";

    }


  } catch (error) {


    console.error(error);


    alert(

      "ルート検索でエラーが発生しました。\n" +

      error.message

    );

  }

}



// ========================================
// 🚇 入力された名前が駅名か確認
// ========================================


function findStationName(text) {


  const allStations =

    [

      ...karasumaStations,

      ...tozaiStations

    ];


  // 完全一致

  const exact =

    allStations.find(

      station =>
        text.includes(station)

    );


  if (exact) {

    return exact;

  }


  return null;

}
