<script>

let routeLines = [];


// ==================================================
// 🚃 電車CSV
// ==================================================

const trainFiles = {

  karasumaWeekdayUp:
    "karasuma-weekday-up.csv",

  karasumaWeekdayDown:
    "karasuma-weekday-down.csv",

  karasumaHolidayUp:
    "karasuma-holiday-up.csv",

  karasumaHolidayDown:
    "karasuma-holiday-down.csv",

  tozaiWeekdayUp:
    "tozai-weekday-up.csv",

  tozaiWeekdayDown:
    "tozai-weekday-down.csv",

  tozaiHolidayUp:
    "tozai-holiday-up.csv",

  tozaiHolidayDown:
    "tozai-holiday-down.csv"

};


let trainData = {};


// ==================================================
// CSV読み込み
// ==================================================

async function loadCSV(filename) {

  const response =
    await fetch(filename);

  if (!response.ok) {

    throw new Error(
      filename +
      " を読み込めませんでした"
    );

  }

  const text =
    await response.text();

  return parseCSV(text);

}


// ==================================================
// CSV解析
// ==================================================

function parseCSV(text) {

  text =
    text.replace(/^\uFEFF/, "");

  const rows = [];

  let row = [];
  let cell = "";
  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char = text[i];
    const next = text[i + 1];


    if (char === '"') {

      if (
        insideQuotes &&
        next === '"'
      ) {

        cell += '"';
        i++;

      } else {

        insideQuotes =
          !insideQuotes;

      }

      continue;

    }


    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(cell);
      cell = "";

      continue;

    }


    if (
      (char === "\n" ||
       char === "\r") &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }

      row.push(cell);
      rows.push(row);

      row = [];
      cell = "";

      continue;

    }


    cell += char;

  }


  if (
    cell !== "" ||
    row.length > 0
  ) {

    row.push(cell);
    rows.push(row);

  }


  return rows;

}


// ==================================================
// 🚃 全CSV読み込み
// ==================================================

async function loadAllTrainData() {

  const status =
    document.getElementById(
      "train-status"
    );


  try {

    for (
      const [name, filename]
      of Object.entries(trainFiles)
    ) {

      console.log(
        "読み込み中:",
        filename
      );


      trainData[name] =
        await loadCSV(filename);


      console.log(
        "読み込み完了:",
        filename
      );

    }


    status.textContent =
      "✓ 電車データ8件を読み込みました";

    status.style.color =
      "#388e3c";


    console.log(
      "🚃 全電車データ:",
      trainData
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      "⚠ 電車データの読み込みに失敗しました";

    status.style.color =
      "#d32f2f";

  }

}


loadAllTrainData();


// ==================================================
// 🚃 時刻 → 分
// ==================================================

function timeToMinutes(time) {

  if (!time) {
    return null;
  }


  time =
    String(time).trim();


  const match =
    time.match(/^(\d{1,2}):(\d{2})$/);


  if (!match) {
    return null;
  }


  const hour =
    Number(match[1]);

  const minute =
    Number(match[2]);


  return (
    hour * 60 +
    minute
  );

}


// ==================================================
// 🚃 現在時刻
// ==================================================

function getCurrentMinutes() {

  const now =
    new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );

}


// ==================================================
// 📅 土日祝判定
// ==================================================

function isHolidaySchedule() {

  const now =
    new Date();

  const day =
    now.getDay();


  // 土曜日・日曜日
  if (
    day === 0 ||
    day === 6
  ) {

    return true;

  }


  // 現時点では祝日は
  // 土日以外は平日扱い
  return false;

}


// ==================================================
// 🚃 駅名を探す
// ==================================================

function findStationColumn(
  rows,
  stationName
) {

  // 4行目が駅名
  // JavaScriptでは3番目
  const headers =
    rows[3] || [];


  return headers.indexOf(
    stationName
  );

}


// ==================================================
// 🚃 電車を探す
// ==================================================

  // ==================================================
// 🚃 地下鉄の路線情報
// ==================================================

const karasumaStations = [

  "国際会館",
  "松ヶ崎",
  "北山",
  "北大路",
  "鞍馬口",
  "今出川",
  "丸太町",
  "烏丸御池",
  "四条",
  "五条",
  "京都",
  "九条",
  "十条",
  "くいな橋",
  "竹田"

];


const tozaiStations = [

  "六地蔵",
  "石田",
  "醍醐",
  "小野",
  "椥辻",
  "東野",
  "山科",
  "御陵",
  "蹴上",
  "東山",
  "三条京阪",
  "京都市役所前",
  "烏丸御池",
  "二条城前",
  "二条",
  "西大路御池",
  "太秦天神川",

  // 東西線からの直通区間
  "四宮",
  "びわ湖浜大津"

];


// ==================================================
// 🚃 駅がどの路線か調べる
// ==================================================

function getStationLine(station) {

  if (
    karasumaStations.includes(station)
  ) {

    return "karasuma";

  }


  if (
    tozaiStations.includes(station)
  ) {

    return "tozai";

  }


  return null;

}


// ==================================================
// 🚃 指定した路線のCSV一覧
// ==================================================

function getLineFiles(line) {

  const holiday =
    isHolidaySchedule();


  if (line === "karasuma") {

    return [

      holiday
        ? "karasumaHolidayUp"
        : "karasumaWeekdayUp",

      holiday
        ? "karasumaHolidayDown"
        : "karasumaWeekdayDown"

    ];

  }


  if (line === "tozai") {

    return [

      holiday
        ? "tozaiHolidayUp"
        : "tozaiWeekdayUp",

      holiday
        ? "tozaiHolidayDown"
        : "tozaiWeekdayDown"

    ];

  }


  return [];

}


// ==================================================
// 🚃 指定時刻以降の電車を探す
// ==================================================

function findNextTrainAfter(
  startStation,
  endStation,
  afterMinutes
) {

  const line =
    getStationLine(
      startStation
    );


  if (!line) {
    return null;
  }


  const endLine =
    getStationLine(
      endStation
    );


  if (
    !endLine ||
    endLine !== line
  ) {

    return null;

  }


  const files =
    getLineFiles(line);


  const candidates = [];


  // ================================================
  // 上り・下り両方を見る
  // ================================================

  for (
    const fileName of files
  ) {

    const rows =
      trainData[fileName];


    if (!rows) {
      continue;
    }


    // 4行目が駅名
    const headers =
      rows[3] || [];


    const startIndex =
      headers.indexOf(
        startStation
      );


    const endIndex =
      headers.indexOf(
        endStation
      );


    if (
      startIndex === -1 ||
      endIndex === -1
    ) {

      continue;

    }


    // ==============================================
    // 各電車を確認
    // ==============================================

    for (
      let i = 4;
      i < rows.length;
      i++
    ) {

      const row =
        rows[i];


      if (!row) {
        continue;
      }


      const startTime =
        timeToMinutes(
          row[startIndex]
        );


      const endTime =
        timeToMinutes(
          row[endIndex]
        );


      if (
        startTime === null ||
        endTime === null
      ) {

        continue;

      }


      // 出発が指定時刻より前なら除外
      if (
        startTime < afterMinutes
      ) {

        continue;

      }


      let travelTime =
        endTime - startTime;


      // 深夜をまたぐ場合
      if (
        travelTime < 0
      ) {

        travelTime += 24 * 60;

      }


      candidates.push({

        fileName:
          fileName,

        startTime:
          startTime,

        endTime:
          endTime,

        travelTime:
          travelTime

      });

    }

  }


  if (
    candidates.length === 0
  ) {

    return null;

  }


  // 一番早く出発する電車
  candidates.sort(
    (a, b) =>
      a.startTime - b.startTime
  );


  return candidates[0];

}


// ==================================================
// 🚃 現在時刻から次の電車
// ==================================================

function findDirectTrain(
  startStation,
  endStation
) {

  return findNextTrainAfter(

    startStation,
    endStation,

    getCurrentMinutes()

  );

}


// ==================================================
// 🚃 乗り換え検索
// ==================================================

function findTransferTrain(
  startStation,
  endStation
) {

  const startLine =
    getStationLine(
      startStation
    );


  const endLine =
    getStationLine(
      endStation
    );


  // 同じ路線なら乗換不要
  if (
    startLine === endLine
  ) {

    return null;

  }


  // ==============================================
  // 乗換駅
  // ==============================================

  const transferStation =
    "烏丸御池";


  // ==============================================
  // 乗換に必要な時間
  // ==============================================
  // ホーム移動などを考えて4分とする

  const transferMinutes = 4;


  // ==============================================
  // 現在時刻
  // ==============================================

  const now =
    getCurrentMinutes();


  // ==============================================
  // 最初の路線の候補を探す
  // ==============================================

  const firstFiles =
    getLineFiles(
      startLine
    );


  const secondFiles =
    getLineFiles(
      endLine
    );


  const candidates = [];


  // ==============================================
  // 1本目の電車を全部確認
  // ==============================================

  for (
    const fileName of firstFiles
  ) {

    const rows =
      trainData[fileName];


    if (!rows) {
      continue;
    }


    const headers =
      rows[3] || [];


    const startIndex =
      headers.indexOf(
        startStation
      );


    const transferIndex =
      headers.indexOf(
        transferStation
      );


    if (
      startIndex === -1 ||
      transferIndex === -1
    ) {

      continue;

    }


    // ==========================================
    // 1本目の電車
    // ==========================================

    for (
      let i = 4;
      i < rows.length;
      i++
    ) {

      const row =
        rows[i];


      if (!row) {
        continue;
      }


      const startTime =
        timeToMinutes(
          row[startIndex]
        );


      const transferArrival =
        timeToMinutes(
          row[transferIndex]
        );


      if (
        startTime === null ||
        transferArrival === null
      ) {

        continue;

      }


      // 現在時刻より前の電車は除外
      if (
        startTime < now
      ) {

        continue;

      }


      // ========================================
      // 乗換可能時刻
      // ========================================

      const secondStartAfter =
        transferArrival +
        transferMinutes;


      // ========================================
      // 2本目の電車を探す
      // ========================================

      for (
        const secondFileName
        of secondFiles
      ) {

        const secondRows =
          trainData[
            secondFileName
          ];


        if (!secondRows) {
          continue;
        }


        const secondHeaders =
          secondRows[3] || [];


        const secondTransferIndex =
          secondHeaders.indexOf(
            transferStation
          );


        const endIndex =
          secondHeaders.indexOf(
            endStation
          );


        if (
          secondTransferIndex === -1 ||
          endIndex === -1
        ) {

          continue;

        }


        // ======================================
        // 2本目の電車
        // ======================================

        for (
          let j = 4;
          j < secondRows.length;
          j++
        ) {

          const secondRow =
            secondRows[j];


          if (!secondRow) {
            continue;
          }


          const secondStart =
            timeToMinutes(
              secondRow[
                secondTransferIndex
              ]
            );


          const secondEnd =
            timeToMinutes(
              secondRow[
                endIndex
              ]
            );


          if (
            secondStart === null ||
            secondEnd === null
          ) {

            continue;

          }


          // 乗換に間に合わない電車
          if (
            secondStart <
            secondStartAfter
          ) {

            continue;

          }


          let secondTravelTime =
            secondEnd -
            secondStart;


          if (
            secondTravelTime < 0
          ) {

            secondTravelTime +=
              24 * 60;

          }


          // ====================================
          // 全体の所要時間
          // ====================================

          let totalTime =
            secondEnd -
            startTime;


          if (
            totalTime < 0
          ) {

            totalTime +=
              24 * 60;

          }


          candidates.push({

            firstFile:
              fileName,

            secondFile:
              secondFileName,

            firstStart:
              startTime,

            transferArrival:
              transferArrival,

            secondStart:
              secondStart,

            finalArrival:
              secondEnd,

            totalTime:
              totalTime,

            firstTravelTime:
              transferArrival -
              startTime,

            secondTravelTime:
              secondTravelTime

          });


          // 一番早い2本目を見つけたら
          // この電車については終了
          break;

        }

      }

    }

  }


  if (
    candidates.length === 0
  ) {

    return null;

  }


  // 最終到着時刻が早い順
  candidates.sort(
    (a, b) =>
      a.totalTime -
      b.totalTime
  );


  return candidates[0];

}

function searchTrain() {

      .value
      .trim();


  const status =
    document.getElementById(
      "train-status"
    );


  if (
    !startStation ||
    !endStation

// ==================================================
// 📍 住所 → 緯度経度
// ==================================================

async function geocode(place) {

  const url =
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;


  const response =
    await fetch(url);


  const data =
    await response.json();


  if (
    data.length === 0
  ) {

    throw new Error(
      place +
      " が見つかりませんでした"
    );

  }


  return {

    lat:
      parseFloat(
        data[0].lat
      ),

    lon:
      parseFloat(
        data[0].lon
      )

  };

}


// ==================================================
// 距離表示
// ==================================================

function formatDistance(meters) {

  if (
    meters < 1000
  ) {

    return (
      Math.round(meters) +
      " m"
    );

  }


  return (
    (meters / 1000)
      .toFixed(1) +
    " km"
  );

}


// ==================================================
// 時間表示
// ==================================================

function formatTime(minutes) {

  minutes =
    Math.round(minutes);


  if (
    minutes < 60
  ) {

    return (
      minutes +
      "分"
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    minutes % 60;


  return (
    hours +
    "時間" +
    mins +
    "分"
  );

}


// ==================================================
// 🚗 OSRMルート
// ==================================================

async function getRoute(
  start,
  end,
  profile
) {

  const url =
    `https://router.project-osrm.org/route/v1/${profile}/` +
    `${start.lon},${start.lat};${end.lon},${end.lat}` +
    `?overview=full&geometries=geojson`;


  const response =
    await fetch(url);


  const data =
    await response.json();


  if (
    data.code !== "Ok"
  ) {

    throw new Error(
      "ルートを取得できませんでした"
    );

  }


  return data.routes[0];

}


// ==================================================
// 🚶🚲🚗 ルート検索
// ==================================================

async function searchRoute() {

  const startText =
    document
      .getElementById("start")
      .value;


  const endText =
    document
      .getElementById("end")
      .value;


  if (
    !startText ||
    !endText
  ) {

    alert(
      "出発地と目的地を入力してください！"
    );

    return;

  }


  try {

    // ============================================
    // 地名 → 緯度経度
    // ============================================

    const start =
      await geocode(
        startText
      );


    const end =
      await geocode(
        endText
      );


    // ============================================
    // 地図移動
    // ============================================

    map.setView(
      [
        start.lat,
        start.lon
      ],
      13
    );


    // ============================================
    // 前のルート削除
    // ============================================

    routeLines.forEach(
      line => {

        map.removeLayer(
          line
        );

      }
    );


    routeLines = [];


    // ============================================
    // 出発地点
    // ============================================

    L.marker(
      [
        start.lat,
        start.lon
      ]
    )
    .addTo(map)
    .bindPopup(
      "出発地"
    )
    .openPopup();


    // ============================================
    // 目的地点
    // ============================================

    L.marker(
      [
        end.lat,
        end.lon
      ]
    )
    .addTo(map)
    .bindPopup(
      "目的地"
    );


    // ============================================
    // 徒歩
    // ============================================

    const walk =
      await getRoute(
        start,
        end,
        "walking"
      );


    // ============================================
    // 自転車
    // ============================================

    const bike =
      await getRoute(
        start,
        end,
        "cycling"
      );


    // ============================================
    // 車
    // ============================================

    const car =
      await getRoute(
        start,
        end,
        "driving"
      );


    // ============================================
    // 徒歩ルート表示
    // ============================================

    const walkLine =
      L.geoJSON(
        walk.geometry
      ).addTo(map);


    routeLines.push(
      walkLine
    );


    // ============================================
    // 距離
    // ============================================

    document.getElementById(
      "walk-distance"
    ).textContent =
      formatDistance(
        walk.distance
      );


    document.getElementById(
      "bike-distance"
    ).textContent =
      formatDistance(
        bike.distance
      );


    document.getElementById(
      "car-distance"
    ).textContent =
      formatDistance(
        car.distance
      );


    // ============================================
    // 徒歩時間
    // ============================================

    const walkTime =
      (walk.distance / 1000)
      / 4.5 * 60;


    document.getElementById(
      "walk-time"
    ).textContent =
      formatTime(
        walkTime
      );


    // ============================================
    // 自転車時間
    // ============================================

    const bikeTime =
      (bike.distance / 1000)
      / 15 * 60;


    document.getElementById(
      "bike-time"
    ).textContent =
      formatTime(
        bikeTime
      );


    // ============================================
    // 車時間
    // ============================================

    const carTime =
      (car.distance / 1000)
      / 50 * 60;


    document.getElementById(
      "car-time"
    ).textContent =
      formatTime(
        carTime
      );


    // ============================================
    // 車CO₂
    // ============================================

    const carCO2 =
      (car.distance / 1000)
      * 130;


    document.getElementById(
      "car-co2"
    ).textContent =
      Math.round(
        carCO2
      ) +
      " g";


  } catch (error) {

    console.error(
      error
    );


    alert(
      "ルート検索でエラーが発生しました。\n" +
      error.message
    );

  }

}
