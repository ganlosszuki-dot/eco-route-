<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🌱 Eco Route</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5fff5;
      color: #333;
    }

    header {
      background: #4caf50;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 28px;
      font-weight: bold;
    }

    .search-box {
      padding: 15px;
      background: white;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    input {
      padding: 12px;
      font-size: 16px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #388e3c;
    }

    #map {
      height: 450px;
      width: 100%;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .card.best {
      border: 3px solid #4caf50;
    }

    .icon {
      font-size: 40px;
    }

    h3 {
      margin: 10px 0;
      font-size: 22px;
    }

    .info {
      margin: 10px 0;
      color: #555;
    }

    .big-number {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    .co2 {
      margin-top: 15px;
      color: #388e3c;
      font-weight: bold;
    }

    .co2-number {
      font-size: 20px;
      margin-top: 4px;
    }

    /* 注記 */
    .note {
      margin: 10px 20px 30px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<header>
  🌱 Eco Route
</header>

<div class="search-box">
  <input id="start" type="text" placeholder="出発地">
  <input id="end" type="text" placeholder="目的地">
  <button onclick="searchRoute()">ルート検索</button>
</div>

<div id="map"></div>

<div class="cards">

  <!-- 徒歩 -->
  <div class="card best">
    <div class="icon">🚶</div>
    <h3>徒歩</h3>

    <div class="info">
      距離
      <div class="big-number" id="walk-distance">--</div>
    </div>

    <div class="info">
      時間
      <div class="big-number" id="walk-time">--</div>
    </div>

    <div class="co2">
      🌱 CO₂
      <div class="co2-number">0 g</div>
    </div>
  </div>


  <!-- 自転車 -->
  <div class="card">
    <div class="icon">🚲</div>
    <h3>自転車</h3>

    <div class="info">
      距離
      <div class="big-number" id="bike-distance">--</div>
    </div>

    <div class="info">
      時間
      <div class="big-number" id="bike-time">--</div>
    </div>

    <div class="co2">
      🌱 CO₂
      <div class="co2-number">0 g</div>
    </div>
  </div>


  <!-- 車 -->
  <div class="card">
    <div class="icon">🚗</div>
    <h3>車</h3>

    <div class="info">
      距離
      <div class="big-number" id="car-distance">--</div>
    </div>

    <div class="info">
      時間
      <div class="big-number" id="car-time">--</div>
    </div>

    <div class="co2">
      🌱 CO₂
      <div class="co2-number" id="car-co2">--</div>
    </div>
  </div>


  <!-- 電車 -->
  <div class="card">
    <div class="icon">🚃</div>
    <h3>電車</h3>

    <div class="info">
      距離
      <div class="big-number">--</div>
    </div>

    <div class="info">
      時間
      <div class="big-number">--</div>
    </div>

    <div class="co2">
      🌱 CO₂
      <div class="co2-number">--</div>
    </div>
  </div>


  <!-- バス -->
  <div class="card">
    <div class="icon">🚌</div>
    <h3>バス</h3>

    <div class="info">
      距離
      <div class="big-number">--</div>
    </div>

    <div class="info">
      時間
      <div class="big-number">--</div>
    </div>

    <div class="co2">
      🌱 CO₂
      <div class="co2-number">--</div>
    </div>
  </div>

</div>


<!-- 注記 -->
<div class="note">
  <strong>注記</strong><br>
  車の所要時間は、時速50kmで走行すると仮定して計算しています。<br>
  実際の所要時間は道路状況や交通状況などによって異なります。
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // 地図
  const map = L.map('map').setView([35.0116, 135.7681], 13);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  let routeLines = [];


  // 住所 → 緯度経度
  async function geocode(place) {

    const url =
      `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;

    const response = await fetch(url);
    const data = await response.json();

    if (data.length === 0) {
      throw new Error(place + " が見つかりませんでした");
    }

    return {
      lat: parseFloat(data[0].lat),
      lon: parseFloat(data[0].lon)
    };
  }


  // 距離を表示
  function formatDistance(meters) {

    if (meters < 1000) {
      return Math.round(meters) + " m";
    }

    return (meters / 1000).toFixed(1) + " km";
  }


  // 時間を表示
  function formatTime(minutes) {

    minutes = Math.round(minutes);

    if (minutes < 60) {
      return minutes + "分";
    }

    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;

    return hours + "時間" + mins + "分";
  }


  // OSRMでルート取得
  async function getRoute(start, end, profile) {

    const url =
      `https://router.project-osrm.org/route/v1/${profile}/` +
      `${start.lon},${start.lat};${end.lon},${end.lat}` +
      `?overview=full&geometries=geojson`;

    const response = await fetch(url);
    const data = await response.json();

    if (data.code !== "Ok") {
      throw new Error("ルートを取得できませんでした");
    }

    return data.routes[0];
  }


  // ルート検索
  async function searchRoute() {

    const startText =
      document.getElementById("start").value;

    const endText =
      document.getElementById("end").value;


    if (!startText || !endText) {
      alert("出発地と目的地を入力してください！");
      return;
    }


    try {

      // 地名を緯度経度に変換
      const start = await geocode(startText);
      const end = await geocode(endText);


      // 地図を移動
      map.setView(
        [start.lat, start.lon],
        13
      );


      // 前のルートを削除
      routeLines.forEach(line => {
        map.removeLayer(line);
      });

      routeLines = [];


      // 出発地点
      L.marker([start.lat, start.lon])
        .addTo(map)
        .bindPopup("出発地")
        .openPopup();


      // 目的地点
      L.marker([end.lat, end.lon])
        .addTo(map)
        .bindPopup("目的地");


      // 徒歩
      const walk =
        await getRoute(start, end, "walking");


      // 自転車
      const bike =
        await getRoute(start, end, "cycling");


      // 車
      const car =
        await getRoute(start, end, "driving");


      // 徒歩ルートを表示
      const walkLine =
        L.geoJSON(walk.geometry)
          .addTo(map);

      routeLines.push(walkLine);


      // 距離
      document.getElementById("walk-distance")
        .textContent =
        formatDistance(walk.distance);

      document.getElementById("bike-distance")
        .textContent =
        formatDistance(bike.distance);

      document.getElementById("car-distance")
        .textContent =
        formatDistance(car.distance);


      // =========================
      // 徒歩の時間
      // 時速4.5km
      // =========================

      const walkTime =
        (walk.distance / 1000) / 4.5 * 60;

      document.getElementById("walk-time")
        .textContent =
        formatTime(walkTime);


      // =========================
      // 自転車の時間
      // 時速15km
      // =========================

      const bikeTime =
        (bike.distance / 1000) / 15 * 60;

      document.getElementById("bike-time")
        .textContent =
        formatTime(bikeTime);


      // =========================
      // 🚗 車の時間
      // 時速50kmで計算
      // =========================

      const carTime =
        (car.distance / 1000) / 50 * 60;

      document.getElementById("car-time")
        .textContent =
        formatTime(carTime);


      // =========================
      // 車のCO₂
      // 1kmあたり130g
      // =========================

      const carCO2 =
        (car.distance / 1000) * 130;

      document.getElementById("car-co2")
        .textContent =
        Math.round(carCO2) + " g";


    } catch (error) {

      console.error(error);

      alert(
        "ルート検索でエラーが発生しました。\n" +
        error.message
      );

    }

  }

</script>

</body>
</html>
